name: Deploy FastAPI backend
on:
  push:
    branches: [main]
    paths: ["backend/**", "sdk/**"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      APP_ENV: test
      JWT_SECRET: "ci-test-secret-at-least-32-characters-long"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      - name: Run tests
        working-directory: backend
        run: python -m pytest -q --tb=short

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts
      - name: Sync backend
        run: |
          rsync -az --delete \
            --exclude='.env' --exclude='.env.*' \
            --exclude='.venv/' --exclude='*.db' --exclude='*.sqlite*' \
            --exclude='uploads/' --exclude='**/__pycache__/' \
            --exclude='.pytest_cache/' \
            backend/ "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/opt/tooltruth/backend/"
      - name: Sync SDK
        run: |
          rsync -az --delete sdk/ "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/opt/tooltruth/sdk/"
      - name: Restart API and health check
        run: |
          ssh "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" \
            "sudo systemctl restart tooltruth-api && \
             sudo systemctl --no-pager --full status tooltruth-api && \
             curl -sf http://localhost:8000/healthz"
