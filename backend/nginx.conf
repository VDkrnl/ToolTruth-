# ToolTruth API reverse proxy.
# Install as /etc/nginx/sites-available/tooltruth-api on the production server.
# certbot can add the HTTPS listener/certificates after DNS points to this server.

server {
    listen 80;
    listen [::]:80;
    server_name api.tooltruth.duckdns.org;

    client_max_body_size 25M;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
